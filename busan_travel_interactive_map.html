    // 1. Initialize Map centered at Busan
    const mapContainer = document.getElementById('map');
    const mapOption = {
      center: new kakao.maps.LatLng(35.1500, 129.1000),
      level: 8
    };
    const map = new kakao.maps.Map(mapContainer, mapOption);

    // Controls
    const zoomControl = new kakao.maps.ZoomControl();
    map.addControl(zoomControl, kakao.maps.ControlPosition.BOTTOMRIGHT);

    // ============================================
    // 휠 클릭(마우스 중간 버튼) 드래그 맵 이동 기능
    // ============================================
    let isMiddleDragging = false;
    let middleStartX = 0;
    let middleStartY = 0;
    let startCenterPoint = null;

    window.addEventListener('auxclick', function(e) {
      if (e.button === 1) e.preventDefault();
    });

    mapContainer.addEventListener('mousedown', function(e) {
      if (e.button === 1) {
        e.preventDefault();
        isMiddleDragging = true;
        middleStartX = e.clientX;
        middleStartY = e.clientY;
        const proj = map.getProjection();
        startCenterPoint = proj.pointFromCoords(map.getCenter());
        mapContainer.style.cursor = 'grabbing';
      }
    });

    window.addEventListener('mousemove', function(e) {
      if (!isMiddleDragging || !startCenterPoint) return;
      e.preventDefault();
      const dx = e.clientX - middleStartX;
      const dy = e.clientY - middleStartY;
      const proj = map.getProjection();
      const newPoint = new kakao.maps.Point(startCenterPoint.x - dx, startCenterPoint.y - dy);
      const newCenter = proj.coordsFromPoint(newPoint);
      map.setCenter(newCenter);
    });

    window.addEventListener('mouseup', function(e) {
      if (e.button === 1 && isMiddleDragging) {
        e.preventDefault();
        isMiddleDragging = false;
        startCenterPoint = null;
        mapContainer.style.cursor = '';
      }
    });

    let isTrafficOn = false;
    function toggleTraffic() {
      isTrafficOn = !isTrafficOn;
      const btn = document.getElementById('traffic-btn');
      if (isTrafficOn) {
        map.addOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
        btn.classList.add('bg-emerald-600', 'text-white');
      } else {
        map.removeOverlayMapTypeId(kakao.maps.MapTypeId.TRAFFIC);
        btn.classList.remove('bg-emerald-600', 'text-white');
      }
    }

    let isSkyview = false;
    function toggleSkyview() {
      isSkyview = !isSkyview;
      const btn = document.getElementById('skyview-btn');
      if (isSkyview) {
        map.setMapTypeId(kakao.maps.MapTypeId.HYBRID);
        btn.classList.add('bg-blue-600', 'text-white');
      } else {
        map.setMapTypeId(kakao.maps.MapTypeId.ROADMAP);
        btn.classList.remove('bg-blue-600', 'text-white');
      }
    }

    let showWalkOnly = false;
    function toggleWalkOnly() {
      showWalkOnly = !showWalkOnly;
      const btn = document.getElementById('walk-filter-btn');
      if (showWalkOnly) {
        btn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-500');
        btn.classList.remove('bg-slate-800', 'text-slate-300');
        btn.innerText = '전체 동선 보기';
      } else {
        btn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-500');
        btn.classList.add('bg-slate-800', 'text-slate-300');
        btn.innerText = '도보만 보기';
      }
      renderMap(activeTab);
    }

    // Map objects storage
    let legItems = [];       // { day, legIndex, polylines, leg, isWalk, bounds }
    let overlayItems = [];   // { day, placeIndex, overlay, domElement, place }
    let activeTab = 'all';

    // Badge styling mapping
    const themeStyles = {
      1: { line: '#ea580c', shadow: '#7c2d12', walkLine: '#10b981', badge: 'bg-orange-600', border: '#ea580c', name: '1일차: 원도심·야시장' },
      2: { line: '#2563eb', shadow: '#1e3a8a', walkLine: '#10b981', badge: 'bg-blue-600', border: '#2563eb', name: '2일차: 해양레일·드론쇼' },
      3: { line: '#0d9488', shadow: '#134e4a', walkLine: '#10b981', badge: 'bg-teal-600', border: '#0d9488', name: '3일차: 영도절벽·귀환' }
    };

    function clearMap() {
      hideBottomInfoBox();
      legItems.forEach(item => {
        item.polylines.forEach(pl => pl.setMap(null));
      });
      legItems = [];

      overlayItems.forEach(item => {
        item.overlay.setMap(null);
      });
      overlayItems = [];
    }

    function hideBottomInfoBox() {
      const box = document.getElementById('bottom-info-box');
      if (box) box.classList.add('hidden');
    }

    // Render Routes & Markers
    function renderMap(tab) {
      clearMap();
      const bounds = new kakao.maps.LatLngBounds();

      const targetDays = tab === 'all' 
        ? daysData 
        : daysData.filter(d => d.day === parseInt(tab));

      targetDays.forEach(day => {
        const style = themeStyles[day.day];

        // 1. Draw Legs (도보 vs 교통 스타일 분기)
        day.legs.forEach((leg, legIdx) => {
          const isWalk = (leg.mode === 'WALK');
          const legBounds = new kakao.maps.LatLngBounds();
          const polylines = [];
          
          let segments = leg.sub_segments || [{ mode: leg.mode, points: leg.points }];

          segments.forEach(seg => {
            const segIsWalk = (seg.mode === 'WALK');
            const path = seg.points.map(pt => {
              const latLng = new kakao.maps.LatLng(pt[1], pt[0]);
              bounds.extend(latLng);
              legBounds.extend(latLng);
              return latLng;
            });

            if (segIsWalk) {
              // 외곽 글로우
              const glowLine = new kakao.maps.Polyline({
                map: map,
                path: path,
                strokeWeight: 8,
                strokeColor: '#064e3b',
                strokeOpacity: 0.5,
                strokeStyle: 'solid'
              });
              polylines.push(glowLine);

              // 메인 도보 점선
              const walkPoly = new kakao.maps.Polyline({
                map: map,
                path: path,
                strokeWeight: 5,
                strokeColor: '#34d399',
                strokeOpacity: 1.0,
                strokeStyle: 'shortdash'
              });
              polylines.push(walkPoly);
            } else {
              // 대중교통/차량: 일자별 테마 굵은 실선
              const shadowLine = new kakao.maps.Polyline({
                map: map,
                path: path,
                strokeWeight: 9,
                strokeColor: style.shadow,
                strokeOpacity: 0.45,
                strokeStyle: 'solid'
              });
              polylines.push(shadowLine);

              const mainLine = new kakao.maps.Polyline({
                map: map,
                path: path,
                strokeWeight: 5,
                strokeColor: style.line,
                strokeOpacity: 0.95,
                strokeStyle: 'solid'
              });
              polylines.push(mainLine);
            }
          });

          // 도보만 보기 모드 적용 (전체 leg 기준으로 숨김 여부 판단)
          if (showWalkOnly && !isWalk) {
            polylines.forEach(pl => pl.setMap(null));
          }

          legItems.push({
            day: day.day,
            legIndex: legIdx,
            polylines: polylines,
            leg: leg,
            isWalk: isWalk,
            bounds: legBounds
          });
        });

        // 2. Draw Place Overlays
        day.places.forEach((p, idx) => {
          const pos = new kakao.maps.LatLng(p.y, p.x);
          bounds.extend(pos);

          const content = document.createElement('div');
          content.id = `marker-${day.day}-${idx}`;
          content.className = `badge-marker ${style.badge} text-white`;
          content.innerHTML = `
            <span class="badge-num">${idx + 1}</span>
            <span>${p.name}</span>
          `;
          content.onclick = function(e) {
            e.stopPropagation();
            focusPlaceByIndex(day.day, idx);
          };

          const overlay = new kakao.maps.CustomOverlay({
            map: map,
            position: pos,
            content: content,
            clickable: true,
            yAnchor: 1.25
          });

          overlayItems.push({
            day: day.day,
            placeIndex: idx,
            overlay: overlay,
            domElement: content,
            place: p
          });
        });
      });

      // Auto Fit Bounds
      map.setBounds(bounds, 70, 70, 70, 70);
      window.lastBounds = bounds;
    }

    // =======================================================
    // 🎯 핵심 기능: 이전 위치 ➔ 해당 위치 동선만 단독 표시
    // =======================================================
    function focusPlaceByIndex(dayNum, idx) {
      const day = daysData.find(d => d.day === dayNum);
      if (!day || !day.places[idx]) return;

      const pCurr = day.places[idx];
      const targetPos = new kakao.maps.LatLng(pCurr.y, pCurr.x);

      // 1) 사이드바 활성화 표시
      document.querySelectorAll('.place-item').forEach(el => el.classList.remove('active'));
      const targetEl = document.getElementById(`place-item-${dayNum}-${idx}`);
      if (targetEl) {
        targetEl.classList.add('active');
        targetEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }

      // 2) 첫 번째 지점인 경우 (이전 위치가 없는 경우)
      if (idx === 0) {
        // 전체 동선 복원 후 첫 지점 줌인
        resetToAllRoutes(false);
        map.setLevel(3);
        map.setCenter(targetPos);
        showBottomInfoBox(dayNum, idx, null, null);
        return;
      }

      // 3) idx > 0: 이전 위치(idx-1) -> 해당 위치(idx) 구간 동선만 단독 표시!
      const prevIdx = idx - 1;
      const pPrev = day.places[prevIdx];
      const targetLegIdx = prevIdx;
      const targetLeg = day.legs[targetLegIdx];

      // 동선 필터링: 오직 이 구간의 폴리라인만 지도에 표시하고 나머지는 숨김!
      const segBounds = new kakao.maps.LatLngBounds();
      segBounds.extend(new kakao.maps.LatLng(pPrev.y, pPrev.x));
      segBounds.extend(targetPos);

      legItems.forEach(item => {
        if (item.day === dayNum && item.legIndex === targetLegIdx) {
          // 활성화된 구간 동선 표시
          item.polylines.forEach(pl => pl.setMap(map));
          // 바운드에 경로 좌표 모두 포함
          item.leg.points.forEach(pt => {
            segBounds.extend(new kakao.maps.LatLng(pt[1], pt[0]));
          });
        } else {
          // 다른 모든 동선은 숨김!
          item.polylines.forEach(pl => pl.setMap(null));
        }
      });

      // 마커 스타일링: 출발지와 도착지만 눈에 띄게 강조, 나머지는 흐리게(dimmed)
      overlayItems.forEach(item => {
        const el = item.domElement;
        el.classList.remove('start-node', 'end-node', 'dimmed');

        if (item.day === dayNum && item.placeIndex === prevIdx) {
          el.classList.add('start-node');
        } else if (item.day === dayNum && item.placeIndex === idx) {
          el.classList.add('end-node');
        } else {
          el.classList.add('dimmed');
        }
      });

      // 카메라 이동: 출발지와 도착지 및 전체 경로가 완벽히 보이도록 자동 맞춤
      map.setBounds(segBounds, 90, 90, 90, 90);

      // 하단 독 정보 상자(Bottom Info Box) 표시!
      showBottomInfoBox(dayNum, idx, pPrev, targetLeg);
    }

    // =======================================================
    // 📦 맵 뷰 하단 정보 상자 (Bottom Info Box) 렌더링

      const style = themeStyles[day.day];
      const box = document.getElementById('bottom-info-box');

      // 상자 테두리 색상 일자별 적용
      box.style.borderColor = style.border;

      let routeHeaderHtml = '';
      if (pPrev && leg) {
        const isWalk = (leg.mode === 'WALK');
        const bg = isWalk ? '#ecfdf5' : '#eff6ff';
        const border = isWalk ? '#a7f3d0' : '#bfdbfe';
        const textCol = isWalk ? '#065f46' : '#1e40af';
        const icon = isWalk ? 'fa-person-walking' : 'fa-location-arrow';

        routeHeaderHtml = `
          <div style="margin-top: 8px; margin-bottom: 8px; padding: 7px 10px; border-radius: 10px; background: ${bg}; border: 1px solid ${border};">
            <div style="display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 700; color: ${textCol};">
              <span><i class="fa-solid ${icon}"></i> 이전: <b>${pPrev.name}</b></span>
              <span>${leg.mode_label || leg.duration_min + '분'}</span>
            </div>
            <div style="font-size: 10px; color: #64748b; margin-top: 3px; font-weight: 500;">
              ${leg.mode_desc || ''}
            </div>
          </div>
        `;
      }

      box.innerHTML = `
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 7px; background: ${style.border}; color: white;">
              ${dayNum}일차 ${idx + 1}번 거점
            </span>
            <span style="font-size: 11px; color: #64748b; font-weight: 600;">${p.name}</span>
          </div>
          <button onclick="hideBottomInfoBox()" style="background: none; border: none; font-size: 14px; color: #94a3b8; cursor: pointer; padding: 2px 6px; line-height: 1;" title="닫기">
            ✕
          </button>
        </div>

        ${routeHeaderHtml}

        <div style="font-weight: 800; font-size: 16px; color: #0f172a; margin-top: ${pPrev ? '4px' : '8px'}; margin-bottom: 3px; line-height: 1.3;">
          ${p.resolved_name || p.name}
        </div>
        <p style="font-size: 12px; color: #475569; margin: 0; line-height: 1.45;">
          ${p.desc || p.addr}
        </p>

        <div style="margin-top: 10px; padding-top: 8px; border-top: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center;">
          <button onclick="resetToAllRoutes()" style="background: none; border: none; font-size: 11px; color: #475569; font-weight: 600; cursor: pointer; padding: 0; display: flex; align-items: center; gap: 4px;">
            <i class="fa-solid fa-rotate-left text-[10px]"></i> 전체 동선 보기
          </button>
          <a href="https://map.kakao.com/link/search/${encodeURIComponent(p.name)}" target="_blank" style="font-size: 11px; color: #2563eb; font-weight: 700; text-decoration: none;">
            카카오맵 크게보기 ↗
          </a>
        </div>
      `;

      box.classList.remove('hidden');
    }

    // =======================================================
    // ↺ 전체 동선 복원
    // =======================================================
    function resetToAllRoutes(autoFit = true) {
      hideBottomInfoBox();

      const targetDays = activeTab === 'all' 
        ? [1, 2, 3] 
        : [parseInt(activeTab)];

      // 모든 폴리라인 다시 표시
      legItems.forEach(item => {
        if (targetDays.includes(item.day)) {
          if (showWalkOnly && !item.isWalk) {
            item.polylines.forEach(pl => pl.setMap(null));
          } else {
            item.polylines.forEach(pl => pl.setMap(map));
          }
        } else {
          item.polylines.forEach(pl => pl.setMap(null));
        }
      });

      // 마커 스타일 복원
      overlayItems.forEach(item => {
        item.domElement.classList.remove('start-node', 'end-node', 'dimmed');
      });

      // 사이드바 선택 해제
      document.querySelectorAll('.place-item').forEach(el => el.classList.remove('active'));

      // 전체 바운드 맞춤
      if (autoFit && window.lastBounds) {
        map.setBounds(window.lastBounds, 70, 70, 70, 70);
      }
    }

    function fitCurrentBounds() {
      resetToAllRoutes(true);
    }

    // Render Timeline in Sidebar with Leg Transition Badges
    function renderTimeline(tab) {
      const container = document.getElementById('timeline-container');
      container.innerHTML = '';

      const targetDays = tab === 'all' 
        ? daysData 
        : daysData.filter(d => d.day === parseInt(tab));

      targetDays.forEach(day => {
        const style = themeStyles[day.day];
        const dayCard = document.createElement('div');
        dayCard.className = 'bg-slate-950/70 border border-slate-800/90 rounded-2xl p-4 shadow-sm';

        let placesHtml = '';
        day.places.forEach((p, i) => {
          placesHtml += `
            <div id="place-item-${day.day}-${i}" class="place-item flex items-start gap-3 group cursor-pointer p-2.5 rounded-xl border border-transparent hover:bg-slate-800/60 transition-all" onclick="focusPlaceByIndex(${day.day}, ${i})">
              <span class="w-6 h-6 rounded-full ${style.badge} text-white text-xs font-bold flex items-center justify-center flex-shrink-0 mt-0.5 shadow-sm">
                ${i + 1}
              </span>
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between">
                  <p class="font-bold text-sm text-slate-100 group-hover:text-blue-400 transition-colors truncate">
                    ${p.name}
                  </p>
                  <i class="fa-solid fa-arrow-right-to-bracket text-slate-600 group-hover:text-blue-400 text-xs transition-colors" title="이전 위치에서 이 지점까지 동선 보기"></i>
                </div>
                <p class="text-xs text-slate-400 truncate mt-0.5">${p.desc}</p>
              </div>
            </div>
          `;

          // 중간 이동 수단 배지 (Leg Bridge)
          if (i < day.places.length - 1 && day.legs[i]) {
            const leg = day.legs[i];
            const isWalk = (leg.mode === 'WALK');
            const iconClass = isWalk ? 'fa-person-walking text-emerald-400' : (leg.mode === 'TAXI' ? 'fa-taxi text-yellow-400' : (leg.mode === 'RAIL' ? 'fa-train-subway text-purple-400' : 'fa-bus text-blue-400'));
            const bgClass = isWalk ? 'bg-emerald-950/40 text-emerald-300 border-emerald-800/50' : 'bg-slate-900/60 text-slate-400 border-slate-800';

            placesHtml += `
              <div class="flex items-center gap-2 pl-5 my-0.5 group/leg cursor-pointer" onclick="focusPlaceByIndex(${day.day}, ${i + 1})" title="${day.places[i].name} ➔ ${day.places[i+1].name} 동선 보기">
                <div class="w-0.5 h-4 bg-slate-800 ml-0.5 group-hover/leg:bg-blue-500 transition-colors"></div>
                <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-medium border ${bgClass} group-hover/leg:border-blue-500/60 transition-all">
                  <i class="fa-solid ${iconClass}"></i>
                  <span>${leg.mode_label || leg.duration_min + '분'}</span>
                  ${isWalk ? '<span class="text-[9px] opacity-75 font-semibold">[도보]</span>' : ''}
                </span>
              </div>
            `;
          }
        });

        dayCard.innerHTML = `
          <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-800">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full ${style.badge}"></span>
              <h3 class="font-bold text-sm text-white">${day.title}</h3>
            </div>
            <span class="text-[11px] text-slate-400 font-medium">${day.places.length}개 거점</span>
          </div>
          <div class="space-y-1">
            ${placesHtml}
          </div>
        `;
        container.appendChild(dayCard);
      });
    }

    // Tab Selection
    function selectTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.className = 'tab-btn text-xs py-1.5 rounded-lg font-semibold text-slate-400 hover:text-white transition-all';
      });
      const activeBtn = document.getElementById('tab-' + tab);
      if (activeBtn) {
        activeBtn.className = 'tab-btn active text-xs py-1.5 rounded-lg font-bold transition-all bg-blue-600 text-white shadow-md';
      }
      renderMap(tab);
      renderTimeline(tab);
    }

    // Initial Load
    selectTab('all');
  </script>
</body>
</html>
